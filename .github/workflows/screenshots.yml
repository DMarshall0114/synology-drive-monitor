name: Screenshots

# 在真实的 Windows 桌面上用演示数据启动界面并截图，结果作为 artifact 下载。
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/make_screenshots.py"
      - ".github/workflows/screenshots.yml"

permissions:
  contents: write  # 把截图推到独立的 screenshots 分支，方便直接用 git / raw 链接取用

jobs:
  screenshots:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Use a 1920x1080 desktop
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - run: python tools/make_screenshots.py screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
      - name: Publish to the screenshots branch
        shell: bash
        run: |
          cd screenshots
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "screenshots for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" screenshots
